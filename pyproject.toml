[project]
name = "dl-final-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[project.optional-dependencies]
# Audio tone case study (audio_tone.py): uv sync --extra audio
audio = [
    "datasets>=3.0",
    "faster-whisper>=1.1",
    "librosa>=0.10",
    "pycountry>=24.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
